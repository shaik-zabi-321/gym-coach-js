<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apna AI Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0D14;--panel:#14161C;--card:#181A20;--line:#2B2D33;--text:#E8E4DC;--dim:#8A8580;--accent:#B8551F}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Barlow,sans-serif}
  h1,label,button,.lbl{font-family:Oswald,sans-serif;font-weight:500;letter-spacing:.02em}
  main{max-width:720px;margin:0 auto;padding:10px 12px 20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .top h1{font-size:1.35rem;margin:4px 0}
  button,select,input{background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 14px;font:inherit;border-radius:0}
  button{cursor:pointer;font-family:Oswald,sans-serif}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);width:100%;font-size:1.1rem;padding:13px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
  .panel{background:var(--panel);border:1px solid var(--line);padding:14px;margin:10px 0}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  select,input{width:100%}
  .bar{display:flex;gap:8px;align-items:center;margin:8px 0}
  #planlabel{flex:1;font:500 1.05rem Oswald,sans-serif}
  .bar button{padding:8px 14px}

  /* Video on top. The box takes the camera's real shape and never taller than 58% of the screen. */
  .stage{--ar:1.333;position:relative;width:min(100%,calc(58vh * var(--ar)));aspect-ratio:var(--ar);margin:0 auto;background:#000;border:1px solid var(--line)}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
  .stage.back video,.stage.back canvas{transform:none}
  #hud{position:absolute;left:10px;top:6px;display:flex;gap:12px;align-items:baseline;text-shadow:0 0 5px #000}
  #hudRep{font:600 2.3rem "JetBrains Mono",monospace}
  #hudSet{font:500 1rem Oswald,sans-serif}
  #status{position:absolute;left:10px;bottom:8px;right:10px;color:#3ddc84;font:600 1rem Oswald,sans-serif;text-shadow:0 0 5px #000}
  #nopose{position:absolute;left:10px;top:60px;color:#ffb347;font:600 1rem Oswald,sans-serif;display:none;text-shadow:0 0 5px #000}

  /* Metrics: three small tiles right under the video, no scrolling needed */
  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
  .m{background:var(--card);border-left:2px solid var(--accent);padding:6px 10px;min-width:0}
  .m .lbl{display:block;color:var(--dim);font-size:.75rem}
  .m b{display:block;font:500 1rem "JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #dbg{font:12px/1.5 "JetBrains Mono",monospace;color:var(--dim);margin-top:6px;word-break:break-word}
  #coachmsg{padding:10px 12px;background:#10281c;border-left:3px solid #3ddc84;color:#bff0d3;min-height:2.8em;font-size:.95rem}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>AI GYM Coach</h1>
    <button id="flip">Camera: Front</button>
  </div>

  <!-- Before the workout: set the plan -->
  <section id="setup" class="panel">
    <div class="field"><label for="ex">Exercise</label><select id="ex"></select></div>
    <div class="row2">
      <div class="field"><label for="sets">Sets</label><input id="sets" type="number" value="2" min="1" max="50"></div>
      <div class="field"><label for="rps">Reps per set</label><input id="rps" type="number" value="10" min="1" max="50"></div>
    </div>
    <button class="primary" id="start" disabled>Loading model...</button>
  </section>

  <!-- During the workout: one slim bar, so the video sits at the top -->
  <div id="livebar" class="bar" hidden>
    <span id="planlabel"></span>
    <button id="end">End</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="hud"><span id="hudRep">0 / 0</span><span id="hudSet">SET 0 / 0</span></div>
    <div id="nopose">NO POSE DETECTED. FACE THE CAMERA</div>
    <div id="status"></div>
  </div>

  <div class="chips" id="metrics"></div>
  <div id="coachmsg" aria-live="polite">Pick your plan and press Start.</div>
  <div id="dbg"></div>
</main>

<script type="module">
import {PoseLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
import {DETECTORS, METRIC_LABELS, POSE_CONNECTIONS, bodyVisible, statusText}
  from "{{ url_for('static', filename='js/detectors.js') }}";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d"), stage = $("stage");
Object.keys(DETECTORS).forEach(n => $("ex").add(new Option(n, n)));

// Same "full" model as your Streamlit app. For slower phones swap "full" for "lite" in this URL.
const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task";
let landmarker;
(async () => {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await PoseLandmarker.createFromOptions(fs, {
    baseOptions: {modelAssetPath: MODEL, delegate: "GPU"}, runningMode: "VIDEO", numPoses: 1,
    minPoseDetectionConfidence: .5, minPosePresenceConfidence: .5, minTrackingConfidence: .5});
  $("start").textContent = "Start workout"; $("start").disabled = false;
})();

// ---- coach (mirrors VoicePipeline gating) ----
let busy = false, playing = false, lastSpoken = 0, lastKind = "";
// One audio player reused for every cue. It is "unlocked" by the Start tap, because phones block sound that starts later without a tap.
const player = new Audio();
player.onended = player.onerror = () => playing = false;
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
const DBG = {ok: null, sent: 0, server: "-"};
function dbg() {
  const ago = lastSpoken ? Math.round((Date.now() - lastSpoken) / 1000) + "s ago" : "never";
  $("dbg").textContent = `camera confidence: ${DBG.ok === false ? "LOW (coach paused)" : "OK"} | checks sent: ${DBG.sent} | server: ${DBG.server} | last cue: ${ago}`;
}
const MAJOR = ["workout_started", "set_completed", "workout_completed"];
async function speak(event, metrics) {
  const major = MAJOR.includes(event);
  const now = Date.now();
  if (busy) { DBG.server = "waiting for previous request"; return; }
  if (!major && playing) { DBG.server = "waiting: audio is playing"; return; }
  if (!major && now - lastSpoken < 5000) { DBG.server = "cooldown (5s between cues)"; return; }
  busy = true; DBG.sent++;
  const t0 = Date.now();
  try {
    const res = await fetch("/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({event, exercise: S.ex, metrics})});
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    // Throw away answers that are out of date: too slow, or "step into frame" after you are back in frame.
    const stale = (!major && Date.now() - t0 > 4000) || (event === "no_pose_detected" && S.poseOk);
    DBG.server = stale ? "discarded (answer arrived too late)"
               : d.text ? "issue found: " + (d.issue || "(event)") : (d.note || "no form issue found");
    if (d.text && !stale) {
      lastSpoken = Date.now(); lastKind = event;
      $("coachmsg").textContent = "🤖 Coach: " + d.text;
      if (d.audio) {
        player.src = "data:" + d.audio_format + ";base64," + d.audio;
        playing = true;
        player.play().catch(() => { playing = false; $("coachmsg").textContent += "  (sound blocked: tap the screen once)"; });
      } else {
        $("coachmsg").textContent += "  (voice unavailable)";
      }
    }
  } catch (e) { console.error(e); DBG.server = "error: " + e.message; $("coachmsg").textContent = "Coach error: " + e.message; }
  busy = false; dbg();
}

// ---- workout state (mirrors metrics.py) ----
const S = {on: false, ex: "", sets: 0, rps: 0, savedSets: 0, finished: false, lastCheck: 0, lastRender: 0, poseOk: false, noPoseSince: 0};

function renderMetrics(m) {
  const box = $("metrics"); box.innerHTML = "";
  for (const [key, label, unit] of METRIC_LABELS[S.ex]) {
    const d = document.createElement("div"); d.className = "m";
    d.innerHTML = `<span class="lbl">${label}</span><b>${m ? m[key] : "-"}${m && unit ? unit : ""}</b>`;
    box.appendChild(d);
  }
}

function onMetrics(m, ok) {
  const reps = m.reps, setsDone = Math.floor(reps / S.rps), cur = reps % S.rps;
  const complete = setsDone >= S.sets;
  const t = Date.now();
  if (t - S.lastRender > 250) {            // refresh numbers 4x/sec so they are readable
    S.lastRender = t;
    $("hudRep").textContent = `${cur} / ${S.rps}`;
    $("hudSet").textContent = complete ? "WORKOUT DONE" : `SET ${setsDone + 1} / ${S.sets}`;
    renderMetrics(m); DBG.ok = ok; dbg();
  }
  if (setsDone > S.savedSets) {            // TODO phase 2: POST to /api/workouts to save in DB
    S.savedSets = setsDone;
    if (!complete) speak("set_completed", m);
  }
  if (complete && !S.finished) { S.finished = true; speak("workout_completed", m); return; }
  if (S.finished) return;
  const now = Date.now();
  if (ok && now - S.lastCheck > 1500) { S.lastCheck = now; speak("ongoing_form_check", m); }
}

function draw(lm) {
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!lm) return;
  ctx.strokeStyle = "#00ff00"; ctx.lineWidth = 6;
  for (const [a, b] of POSE_CONNECTIONS)
    if (lm[a].visibility > .7 && lm[b].visibility > .7) {
      ctx.beginPath(); ctx.moveTo(lm[a].x * w, lm[a].y * h); ctx.lineTo(lm[b].x * w, lm[b].y * h); ctx.stroke(); }
  ctx.fillStyle = "#2f6bff";
  for (const p of lm) if (p.visibility > .7) { ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 6, 0, 7); ctx.fill(); }
}

// light smoothing so landmarks do not jitter frame to frame
let prev = null;
function smooth(lm) {
  const a = 0.5;
  prev = prev && prev.length === lm.length
    ? lm.map((p, i) => ({x: a * p.x + (1 - a) * prev[i].x, y: a * p.y + (1 - a) * prev[i].y, visibility: p.visibility}))
    : lm.map(p => ({x: p.x, y: p.y, visibility: p.visibility}));
  return prev;
}

let last = -1;
function loop() {
  if (!S.on) return;
  if (video.readyState >= 2 && video.currentTime !== last) {
    last = video.currentTime;
    const r = landmarker.detectForVideo(video, performance.now());
    if (r.landmarks.length) {
      $("nopose").style.display = "none";
      if (!S.poseOk) {                                   // you just came back into frame
        S.poseOk = true; S.noPoseSince = 0;
        if (lastKind === "no_pose_detected") {           // remove the old "step into frame" message and sound
          player.pause(); playing = false; lastKind = "";
          $("coachmsg").textContent = "Tracking you again.";
        }
      }
      const lm = smooth(r.landmarks[0]);
      draw(lm);
      // Always show the live numbers. If the camera is unsure, dim them and warn, and do not coach on shaky data.
      const ok = bodyVisible(S.ex, lm);
      const m = DETECTORS[S.ex].process(lm, video.videoWidth / video.videoHeight);
      $("status").textContent = statusText(S.ex, m) + (ok ? "" : "  ·  LOW CONFIDENCE, MOVE BACK");
      $("metrics").style.opacity = ok ? 1 : 0.55;
      onMetrics(m, ok);
    } else {
      prev = null; S.poseOk = false; draw(null); $("nopose").style.display = "block";
      $("status").textContent = ""; $("metrics").style.opacity = 1;
      if (Date.now() - S.lastRender > 250) { S.lastRender = Date.now(); renderMetrics(null); }   // clear old numbers to "-"
      if (!S.noPoseSince) S.noPoseSince = Date.now();
      // Only complain after 3 seconds of really having no pose (not in the first camera frames)
      if (!S.finished && Date.now() - S.noPoseSince > 3000 && Date.now() - S.lastCheck > 8000) {
        S.lastCheck = Date.now();
        speak("no_pose_detected", {issue: "No pose detected. Step into the camera frame and make sure your full body is visible."});
      }
    }
  }
  requestAnimationFrame(loop);
}

// ---- camera ----
let facing = "user";
async function startCamera() {
  video.srcObject?.getTracks().forEach(t => t.stop());
  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video: {facingMode: {ideal: facing}, width: {ideal: 640}, height: {ideal: 480}}, audio: false});
  await video.play();
  stage.classList.toggle("back", facing === "environment");   // only mirror the selfie camera
  stage.style.setProperty("--ar", video.videoWidth / video.videoHeight);
  prev = null;
}
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  $("flip").textContent = "Camera: " + (facing === "user" ? "Front" : "Back");
  if (S.on) { try { await startCamera(); } catch (e) { $("coachmsg").textContent = "Camera error: " + e.message; } }
};

// ---- start / end ----
$("start").onclick = async () => {
  player.src = SILENT; player.play().catch(() => {});   // unlock sound inside the tap
  try { await startCamera(); }
  catch (e) { $("coachmsg").textContent = "Camera error: " + e.message; return; }
  Object.assign(S, {on: true, ex: $("ex").value, sets: +$("sets").value || 1, rps: +$("rps").value || 1,
                    savedSets: 0, finished: false, lastCheck: 0, lastRender: 0, poseOk: false, noPoseSince: 0});
  DETECTORS[S.ex].reset(); lastSpoken = 0; prev = null;
  $("setup").hidden = true; $("livebar").hidden = false;     // video jumps to the top
  $("planlabel").textContent = `${S.ex} · ${S.sets} × ${S.rps}`;
  $("hudRep").textContent = `0 / ${S.rps}`; $("hudSet").textContent = `SET 1 / ${S.sets}`;
  renderMetrics(null);
  speak("workout_started", {});
  loop();
};
$("end").onclick = () => {
  S.on = false;
  video.srcObject?.getTracks().forEach(t => t.stop());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("status").textContent = ""; $("nopose").style.display = "none";
  $("setup").hidden = false; $("livebar").hidden = true;
  if (!S.finished) { S.finished = true; speak("workout_completed", {}); }
};
</script>
</body>
</html>
